name: Déploiement

# Se lance après une CI réussie sur main.
# Désactivé tant que la variable de dépôt DEPLOY_ENABLED ne vaut pas « true »
# (voir docs/stack-technique.md, section « Mise en service »).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploiement
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1
  TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  image:
    name: Construire et publier l'image
    if: github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: SITE_URL=${{ vars.SITE_URL }}
          tags: ghcr.io/${{ github.repository }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  contenu-production:
    name: Contenu prêt pour la production (mode strict)
    if: github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      # Bloque la production tant qu'il reste un placeholder ([Ville ou région], [X] DH…).
      - run: pnpm check:content --strict

  preprod:
    name: Déployer en préproduction
    needs: image
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - run: sh deploy/deployer.sh "$TAG"
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

  production:
    name: Déployer en production
    needs: [preprod, contenu-production]
    runs-on: ubuntu-latest
    # Configurez une validation manuelle sur l'environnement « production » dans GitHub.
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - run: sh deploy/deployer.sh "$TAG"
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
